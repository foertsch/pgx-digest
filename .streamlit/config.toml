# Streamlit theme for pgx-digest. Dark, purple-tinted, with orange accents
# reserved for "destination" highlights — the final verified-report pill,
# the primary CTA, and hover/active states.

[theme]
base = "dark"
primaryColor = "#A78BFA"
backgroundColor = "#0A0A14"
secondaryBackgroundColor = "#13131D"
textColor = "#E5E7EB"
font = "sans serif"

[browser]
gatherUsageStats = false

[server]
headless = true
